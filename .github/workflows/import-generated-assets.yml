name: Import generated image archive

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/zero-g-bloom-assets.part-*'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reassemble, decode, and extract archive
        run: |
          if ! compgen -G ".asset-staging/zero-g-bloom-assets.part-*" > /dev/null; then
            echo "No staging chunks; nothing to import."
            exit 0
          fi
          mkdir -p assets/generated/conversation-archive
          cat .asset-staging/zero-g-bloom-assets.part-* > /tmp/zero-g-bloom-assets.tar.gz.b64
          base64 -d /tmp/zero-g-bloom-assets.tar.gz.b64 > /tmp/zero-g-bloom-assets.tar.gz
          tar -xzf /tmp/zero-g-bloom-assets.tar.gz -C assets/generated/conversation-archive
          rm -f .asset-staging/zero-g-bloom-assets.part-*

      - name: Commit generated assets
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: archive generated Zero-G Bloom image references"
          git push
